[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-pr-reviewer"
version = "0.1.0"
description = "Open-source AI pull request reviewer powered by OpenAI. Free, configurable, and runs entirely in GitHub Actions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "open-pr-reviewer maintainers" }]
keywords = ["code-review", "github-actions", "openai", "pr-reviewer", "llm", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
open-pr-reviewer = "open_pr_reviewer.cli:main"

[tool.setuptools.packages.find]
include = ["open_pr_reviewer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]